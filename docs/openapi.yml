openapi: 3.1.0
info:
  title: Session Ticket API
  version: 1.0.0
  description: >
    A REST API for creating, retrieving and updating tickets.
    It uses session-based authentication and role-based authorisation.

servers:
  - url: http://localhost:3001
    description: Local development server

components:
  schemas:
    Ticket:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - "null"
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type:
            - string
            - "null"
          enum: [todo, in_progress, done, null]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByID:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalTickets:
          type: integer
        totalPages:
          type: integer

    ValidationError:
      type: object
      required:
        - message
        - error
      properties:
        message:
          type: string
          example: Validation failed

        error:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            priority:
              - Invalid option: expected one of "low"|"medium"|"high"|"urgent"

    AuthenticationError:
      type: object
      required:
        - fail
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Authentication failed

paths:
  /api/tickets:
    get:
      summary: Get tickets accessible to the authenticated user
      description: >
        Returns tickets owned by the authenticated user.
        Users with the Admin role can retrieve all tickets.
      responses:
        "200":
          description: Tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - data
                      - pagination
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Ticket"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          description: The user is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"

  /api/tickets/{id}:
    get:
      summary: Get a single ticket
      description: >
        Returns the ticket identified by the route parameter if the
        authenticated user is authorised to access it.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the ticket
          schema:
            type: string
      responses:
        "200":
          description: Ticket retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Ticket"
        "401":
          description: The user is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
        "403":
          description: The authenticated user is not authorised to access this ticket
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthorised access
        "404":
          description: The specified ticket was not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Ticket not found

  /api/create:
    post:
      summary: Create a ticket
      description: >
        Creates and stores a new ticket when the submitted fields
        pass validation.
      responses:
        "201":
          description: Ticket created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Ticket"
        "400":
          description: The submitted ticket data failed validation
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - error
                properties:
                  message:
                    type: string
                    example: Validation failed
                  error:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      priority:
                        - 'Invalid option: expected one of "low"|"medium"|"high"|"urgent"'
          "401":
            description: The user is not authenticated
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuthenticationError"

  /api/update/{id}:
    patch:
      summary: Update a ticket
      description: >
        Updates the ticket identified by the route parameter.
        A standard user can only update their own tickets, while an
        administrator can update any ticket.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the ticket
          schema:
            type: string
      responses:
        "200":
          description: Ticket updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Ticket"
        "400":
          description: The update failed validation or contains an invalid status transition

          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - error
                properties:
                  message:
                    type: string
                    example: Validation failed
                  error:
                    type: object
                    required:
                      - formErrors
                      - fieldErrors
                    properties:
                      formErrors:
                        type: array
                        items:
                          type: string
                        example:
                          - At least one field must be present
                      fieldErrors:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example: {}
        "401":
          description: The user is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
        "403":
          description: The authenticated user is not authorised to update this ticket
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Forbidden - only the user who created this ticket can update it
        "404":
          description: The specified ticket was not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Ticket not found

  /auth/login:
    post:
      summary: Log in a user
      description: >
        Authenticates the supplied credentials and creates a session
        for the user.
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
        "400":
          description: The submitted login data failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Authentication failed because the credentials were invalid
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Authentication failed

  /auth/register:
    post:
      summary: Register a new user
      description: >
        Creates a new user account when the submitted credentials
        meet the registration requirements.
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created
        "400":
          description: The submitted registration data failed validation
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - error
                properties:
                  message:
                    type: string
                    example: Validation failed
                  error:
                    type: object
                    required:
                      - confirmPassword
                    properties:
                      confirmPassword:
                        type: array
                        items:
                          type: string
                        example:
                          - Password doesn't match
        "409":
          description: An account already exists for the supplied email address
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Email exists in the system
